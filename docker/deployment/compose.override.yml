# Dev only - build the three images from source instead of pulling them.
# Docker loads this automatically alongside compose.yml, so `docker compose up
# -d --build` builds locally while the release asset stays image-only.
# It is not shipped with releases; delete it to force pulls.

services:
  sp_web:
    build:
      context: ../..
      dockerfile: Dockerfile

  sp_supersync:
    build:
      context: ../..
      dockerfile: packages/super-sync-server/Dockerfile

  sp_bridge:
    build:
      context: ../..
      dockerfile: packages/sp-bridge/Dockerfile
