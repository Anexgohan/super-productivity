# Super Productivity — prebuilt multi-arch images from GHCR.
#   docker compose pull
#   docker compose up -d
#
# This file is shipped as a release asset and is the one users run. Building
# from source is compose.override.yml, which docker loads automatically from
# this directory, so `docker compose up -d --build` still builds locally.
#
# All tunables live in .env (copy example.env → .env and edit).
# All paths are relative to this directory → deployable anywhere as-is.
#
# One published port serves everything: the app at /, the sync server at /sync/,
# the REST API at /api/. There is no address to configure.

services:
  web:
    image: ghcr.io/anexgohan/sp-web:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-web
    restart: unless-stopped
    ports:
      - '${SP_WEB_PORT:-18230}:80'
    env_file:
      - .env
    depends_on:
      supersync:
        condition: service_healthy
      sp-bridge:
        condition: service_healthy

  supersync:
    image: ghcr.io/anexgohan/sp-supersync:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-supersync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker-data/supersync:/app/data
    depends_on:
      postgres: # remove for external postgres
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:1900/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SUPERSYNC_MEM_LIMIT:-512m}

  sp-bridge:
    image: ghcr.io/anexgohan/sp-bridge:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker-data/bridge:/app/data
    depends_on:
      supersync:
        condition: service_healthy
      postgres: # remove for external postgres
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves ::1 first but the API binds IPv4, so the container would never report healthy.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:1902/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SP_BRIDGE_MEM_LIMIT:-256m}

  # Bundled database. To use an EXTERNAL postgres instead: comment out this whole
  # service and the two `postgres:` depends_on blocks above, create an empty
  # database on your server, then point POSTGRES_HOST/PORT at it in .env.
  # The schema is created automatically on first start.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: ${STACK_PREFIX:-sp}-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=${PG_SHARED_BUFFERS:-64MB} -c max_connections=${PG_MAX_CONNECTIONS:-20}
    env_file:
      - .env
    volumes:
      # postgres:18 manages a versioned subdir — mount the parent, not /data.
      - ./docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-supersync} -d ${POSTGRES_DB:-supersync}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold first boot runs initdb (~40s+) before accepting connections.
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
