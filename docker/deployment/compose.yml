# Super Productivity. Config lives in .env — copy example.env first.
#   docker compose pull && docker compose up -d

services:
  sp_web:
    image: ghcr.io/anexgohan/sp-web:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-web
    restart: unless-stopped
    ports:
      - '${SP_WEB_PORT:-18230}:80'
    env_file:
      - .env
    depends_on:
      sp_supersync:
        condition: service_healthy
      sp_bridge:
        condition: service_healthy

  sp_supersync:
    image: ghcr.io/anexgohan/sp-supersync:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-supersync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker-data/supersync:/app/data
    depends_on:
      sp_postgres: # remove for external postgres
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:1900/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SUPERSYNC_MEM_LIMIT:-512m}

  sp_bridge:
    image: ghcr.io/anexgohan/sp-bridge:${SP_IMAGE_TAG:-latest}
    container_name: ${STACK_PREFIX:-sp}-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./docker-data/bridge:/app/data
    depends_on:
      sp_supersync:
        condition: service_healthy
      sp_postgres: # remove for external postgres
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves ::1 first but the API binds IPv4, so the container would never report healthy.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:1902/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SP_BRIDGE_MEM_LIMIT:-256m}

  # External postgres? Comment out this service and the two depends_on above, create an empty database, then set POSTGRES_HOST/PORT in .env. Schema is created on first start.
  sp_postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: ${STACK_PREFIX:-sp}-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=${PG_SHARED_BUFFERS:-64MB} -c max_connections=${PG_MAX_CONNECTIONS:-20}
    env_file:
      - .env
    volumes:
      # postgres:18 manages a versioned subdir — mount the parent, not /data.
      - ./docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sp_user} -d ${POSTGRES_DB:-db_sp}']
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold first boot runs initdb (~40s+) before accepting connections.
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
