# Publishes the three deployment images to GHCR as multi-arch (amd64 + arm64).
#
# Design (anex/container-parity):
#  - Each arch builds on its OWN native runner — arm64 on ubuntu-24.04-arm, not
#    QEMU emulation. The web image runs a full Angular build; emulated arm64
#    would turn ~10 min into 40+. (Inspiration: Pankha's release pipeline.)
#  - Multi-arch is assembled by DIGEST, not by leftover `-amd64`/`-arm64` tags:
#    each build pushes an untagged image by digest, then one merge step per
#    image stitches the two into a single tag with `imagetools`. Keeps the
#    package list clean.
#  - Auth is the automatic GITHUB_TOKEN — no secret to create or rotate.
#  - The images bake NO secrets: the sync token and E2E passphrase are injected
#    at runtime by the entrypoint, which is why publishing them public is safe.
#
# We publish our OWN supersync because this fork patches it (ALLOW_INSECURE_HTTP,
# container auto-provision, the plain-HTTP server.ts fix) — upstream's published
# image lacks those.
name: Publish containers
run-name: 'publish-containers ${{ github.event.inputs.version || github.ref_name }}'

# Release-driven, like Pankha: publishing is a deliberate act (cut a version
# tag), not a side effect of every commit. Push a `vX.Y.Z` tag and all three
# images publish at that version; a `-beta`/`-rc` suffix keeps them off `latest`.
on:
  push:
    tags:
      - 'v*'
  # Manual trigger for the first publish, a test build, or an on-demand rebuild.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the images with (e.g. v1.0.0). Omit for a sha-only test build.'
        required: false
      no_cache:
        description: 'Build without cache'
        type: boolean
        default: false

env:
  # GHCR image names must be lowercase; this fork's owner already is.
  REGISTRY_NS: ghcr.io/anexgohan

jobs:
  # Lint gates the whole release rather than living inside the web Dockerfile.
  # There it cost 76s of every local image build and failed AFTER the expensive
  # Angular layer; here it runs once, on GitHub's runners, and stops all six
  # builds before any of them start.
  # ci.yml lints too, but only on pushes and PRs involving main. A tag can point
  # at any commit, so this stays the gate that a release cannot skip.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts || npm i --ignore-scripts
      - run: npm run prepare
      - run: npm run lint

  # Runs alongside `build`, not before it. The builds take ~6 minutes, so the
  # suite finishes inside that window and costs the release almost nothing.
  # `merge` is what creates the public tag, so gating that (below) is what
  # actually stops a failing commit from reaching GHCR.
  test:
    name: test
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Upstream installs a dependency from git+ssh; force HTTPS so npm works without a key.
      - name: Use HTTPS for git deps
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm i
      - run: npm run env # Generate env.generated.ts
      - run: npm run int:test # Validate i18n JSON files
      - run: npm run test

  build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: lint
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing shouldn't cancel the others' builds.
      fail-fast: false
      matrix:
        image:
          - name: sp-web
            file: Dockerfile
          - name: sp-bridge
            file: packages/sp-bridge/Dockerfile
          - name: sp-supersync
            file: packages/super-sync-server/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # native arm64 runner — no QEMU

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Upstream installs a dependency from git+ssh; force HTTPS so `npm ci`
      # inside the build works without an SSH key.
      - name: Use HTTPS for git deps
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          # Skip the provenance attestation, which otherwise adds an
          # unknown/unknown entry to the manifest and confuses `imagetools`.
          provenance: false
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.REGISTRY_NS }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.platform.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Proves the images we are about to tag actually come up and serve.
  # Unit tests cannot catch a broken Dockerfile, entrypoint, nginx route or
  # compose wiring, and those are exactly what reaches the deployment.
  # amd64 only: this checks the wiring, not the architecture, and the arm64
  # image is built from the same Dockerfile.
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the amd64 digests
        uses: actions/download-artifact@v4
        with:
          # No merge-multiple: every artifact holds a file called `amd64`, so
          # flattening them would overwrite all but one.
          pattern: digest-*-amd64
          path: /tmp/digests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env and pin the images to the digests just built
        working-directory: docker/deployment
        run: |
          set -euo pipefail
          sed -e "s|JWT_SECRET='CHANGE_ME'|JWT_SECRET='$(openssl rand -hex 32)'|" \
              -e "s|POSTGRES_PASSWORD='CHANGE_ME'|POSTGRES_PASSWORD='$(openssl rand -hex 16)'|" \
              -e "s|SP_SYNC_ENCRYPTION_PASSWORD='CHANGE_ME'|SP_SYNC_ENCRYPTION_PASSWORD='$(openssl rand -hex 16)'|" \
              -e "s|SP_SYNC_ACCOUNT_EMAIL='you@example.com'|SP_SYNC_ACCOUNT_EMAIL='smoke@example.com'|" \
              -e "s|SP_SYNC_ACCOUNT_PASSWORD='CHANGE_ME'|SP_SYNC_ACCOUNT_PASSWORD='$(openssl rand -hex 12)'|" \
              .env.example > .env
          {
            echo 'services:'
            for image in sp-web sp-bridge sp-supersync; do
              service="sp_${image#sp-}"
              digest="$(cat "/tmp/digests/digest-${image}-amd64/amd64")"
              echo "  ${service}:"
              echo "    image: ${{ env.REGISTRY_NS }}/${image}@${digest}"
            done
          } > compose.override.yml
          cat compose.override.yml

      - name: Bring the stack up
        working-directory: docker/deployment
        # --wait blocks on the healthchecks the compose file already declares.
        # Postgres runs initdb on a cold boot, hence the generous timeout.
        run: docker compose up -d --wait --wait-timeout 300

      - name: The API answers through the web container
        working-directory: docker/deployment
        run: |
          set -euo pipefail
          base="http://localhost:18230"
          # /api/health and /api/docs are the only unauthenticated routes, which
          # is precisely what a smoke test should be limited to.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$base/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          routes=$(curl -fsS "$base/api/docs" | jq '.routes | length')
          echo "documented routes: $routes"
          # A route map that collapsed to nothing means the server booted without its API.
          test "$routes" -gt 40

      - name: Container logs on failure
        if: ${{ failure() }}
        working-directory: docker/deployment
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: ${{ always() }}
        working-directory: docker/deployment
        run: docker compose down -v --remove-orphans

  merge:
    name: merge ${{ matrix.image }}
    runs-on: ubuntu-24.04
    # Both gates: the code passed its tests, and the images it produced come up.
    needs: [build, test, smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [sp-web, sp-bridge, sp-supersync]

    steps:
      - name: Download this image's digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NS }}/${{ matrix.image }}
          # `flavor: latest=auto` (the default) applies `:latest` only for a
          # non-prerelease semver tag, so `v1.2.3` updates latest but
          # `v1.2.3-beta` does not — Pankha's stable/prerelease split, for free.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
            type=sha,prefix=sha-,format=short

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in *; do echo "${{ env.REGISTRY_NS }}/${{ matrix.image }}@$(cat "$f")"; done)

      - name: Inspect result
        run: docker buildx imagetools inspect ${{ env.REGISTRY_NS }}/${{ matrix.image }}:latest

  # Ship the two files a user actually needs to run the stack, so getting
  # started is two wgets and no git clone.
  release:
    name: release assets
    runs-on: ubuntu-24.04
    needs: merge
    # Tag pushes only: a manual dispatch is a rebuild, not a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect assets
        run: |
          mkdir -p release-assets
          # compose.yml is image-only; compose.override.yml (build from source) is deliberately not shipped.
          cp docker/deployment/compose.yml release-assets/compose.yml
          cp docker/deployment/.env.example release-assets/example.env
          ls -l release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Prerelease tags (v1.2.3-rc.1) are marked as such, matching how the image tags already treat them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/compose.yml
            release-assets/example.env
