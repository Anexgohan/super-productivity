@if (label()) {
  <label class="color-label">{{ label() }}</label>
}

<button
  #trigger
  type="button"
  class="color-trigger"
  [class.is-default]="isDefault()"
  [style.--swatch]="isDefault() ? defaultColor() : value()"
  [attr.aria-label]="label() || (T.G.COLOR_PICKER_OPEN | translate)"
  [attr.aria-expanded]="isOpen()"
  [title]="isDefault() ? (T.G.COLOR_PICKER_DEFAULT | translate) : value()"
  (click)="toggle()"
></button>

@if (isOpen()) {
  <div
    class="backdrop"
    (click)="isOpen.set(false)"
  ></div>
  <div
    class="color-panel"
    role="dialog"
    [attr.aria-label]="label() || (T.G.COLOR_PICKER_OPEN | translate)"
    [style.top]="panelTop"
    [style.left]="panelLeft"
  >
    @if (allowDefault()) {
      <button
        type="button"
        class="default-btn"
        [class.selected]="isDefault()"
        (click)="selectColor('')"
      >
        <span
          class="default-swatch"
          [style.--swatch]="defaultColor()"
        ></span>
        {{ T.G.COLOR_PICKER_DEFAULT | translate }}
        @if (isDefault()) {
          <mat-icon>check</mat-icon>
        }
      </button>
    }

    <div
      #svSquare
      class="sv-square"
      [style.background-color]="hueColor()"
      [attr.aria-label]="T.G.COLOR_PICKER_SHADE | translate"
      (pointerdown)="onSvPointerDown($event)"
    >
      <div
        class="sv-handle"
        [style.left.%]="draft().s * 100"
        [style.top.%]="(1 - draft().v) * 100"
        [style.background-color]="draftRgb()"
      ></div>
    </div>

    <input
      class="hue-slider"
      type="range"
      min="0"
      max="359"
      [value]="draft().h"
      [attr.aria-label]="T.G.COLOR_PICKER_HUE | translate"
      (input)="onHueInput($event)"
      (change)="onHueChange()"
    />

    @if (allowAlpha()) {
      <input
        class="alpha-slider"
        type="range"
        min="0"
        max="100"
        [value]="alpha() * 100"
        [style.--swatch]="draftRgb()"
        [attr.aria-label]="T.G.COLOR_PICKER_OPACITY | translate"
        (input)="onAlphaInput($event)"
        (change)="onAlphaChange()"
      />
    }

    <div class="hex-row">
      <span
        class="hex-preview"
        [style.--swatch]="draftHex()"
      ></span>
      <input
        class="hex-input"
        type="text"
        [attr.maxlength]="allowAlpha() ? 9 : 7"
        spellcheck="false"
        autocomplete="off"
        [value]="hexText()"
        [attr.aria-label]="T.G.COLOR_PICKER_HEX | translate"
        (input)="onHexInput($event)"
        (keydown.enter)="onHexCommit()"
        (blur)="onHexCommit()"
      />
      @if (hasEyeDropper) {
        <button
          type="button"
          class="eyedropper-btn"
          [title]="T.G.COLOR_PICKER_EYEDROPPER | translate"
          [attr.aria-label]="T.G.COLOR_PICKER_EYEDROPPER | translate"
          (click)="pickFromScreen()"
        >
          <mat-icon>colorize</mat-icon>
        </button>
      }
    </div>

    <div class="swatch-grid">
      @for (color of presets(); track color) {
        <button
          type="button"
          class="color-swatch"
          [style.--swatch]="color"
          [class.selected]="value() === color"
          [title]="color"
          (click)="selectColor(color)"
        ></button>
      }
    </div>

    @if (recent().length) {
      <div class="swatch-label">{{ T.G.COLOR_PICKER_RECENT | translate }}</div>
      <div class="swatch-grid">
        @for (color of recent(); track color) {
          <button
            type="button"
            class="color-swatch"
            [style.--swatch]="color"
            [class.selected]="value() === color"
            [title]="color"
            (click)="selectColor(color)"
          ></button>
        }
      </div>
    }
  </div>
}
