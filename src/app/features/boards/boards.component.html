<mat-tab-group
  mat-stretch-tabs="false"
  dynamicHeight="true"
  cdkScrollable
  cdkDropList
  cdkDropListOrientation="horizontal"
  cdkDropListElementContainer=".mat-mdc-tab-labels"
  (cdkDropListDropped)="drop($event)"
  (selectedIndexChange)="onTabChange($event)"
  [selectedIndex]="selectedTabIndex()"
>
  @for (board of boards(); track board.id; let i = $index) {
    <mat-tab>
      <ng-template mat-tab-label>
        <div
          cdkDrag
          cdkDragLockAxis="x"
          cdkDragRootElement=".mat-mdc-tab"
          cdkDragPreviewClass="boards-drag-preview"
          [cdkDragStartDelay]="dragStartDelay"
          [matContextMenuTriggerFor]="boardContextMenu"
          [matContextMenuTriggerData]="{ boardCfg: board }"
        >
          {{ board.title | translate }}
        </div>
      </ng-template>
      <ng-template matTabContent>
        <board
          [boardCfg]="board"
          cdkDropListGroup
        ></board>
      </ng-template>
    </mat-tab>
  }

  <mat-tab>
    <ng-template mat-tab-label>
      <div class="tab-header-item">
        <mat-icon>add_circle</mat-icon>
      </div>
    </ng-template>

    <ng-template matTabContent>
      <div class="board-add-wrapper">
        <h2>{{ T.F.BOARDS.V.ADD_NEW_BOARD | translate }}</h2>
        <board-edit
          [boardCfg]="newBoardCfg()"
          (afterSave)="goToLastIndex()"
        ></board-edit>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>

<mat-menu #boardContextMenu>
  <ng-template
    matMenuContent
    let-board="boardCfg"
  >
    <button
      mat-menu-item
      (click)="editBoard(board)"
    >
      <mat-icon>edit</mat-icon>
      {{ T.G.EDIT | translate }}
    </button>
    <button
      mat-menu-item
      [matMenuTriggerFor]="duplicateTargetMenu"
      [matMenuTriggerData]="{ boardCfg: board }"
    >
      <mat-icon>file_copy</mat-icon>
      {{ T.G.DUPLICATE | translate }}
    </button>
    <button
      mat-menu-item
      (click)="removeBoard(board)"
    >
      <mat-icon class="color-warn-i">delete_forever</mat-icon>
      {{ T.G.DELETE | translate }}
    </button>
  </ng-template>
</mat-menu>

<!-- Target project for a duplicate. A board holds no tasks, so this copies the
     columns and their filters and re-points the scope; cards then come from the
     target project's own tasks. -->
<mat-menu #duplicateTargetMenu>
  <ng-template
    matMenuContent
    let-board="boardCfg"
  >
    <button
      mat-menu-item
      (click)="duplicateBoard(board, '')"
    >
      {{ T.MH.PROJECT_SCOPE_ALL | translate }}
    </button>
    @for (project of projects(); track project.id) {
      <button
        mat-menu-item
        (click)="duplicateBoard(board, project.id)"
      >
        {{ project.title }}
      </button>
    }
  </ng-template>
</mat-menu>
