<button
  mat-button
  class="scope-btn"
  [class.isScoped]="isScoped()"
  [matMenuTriggerFor]="scopeMenu"
  [matTooltip]="T.MH.PROJECT_SCOPE | translate"
>
  <mat-icon
    [class.scope-icon--emoji]="isScopeIconEmoji()"
    [style.color]="scopeIconColor()"
    >{{ scopeIcon() }}</mat-icon
  >
  <span class="scope-label">{{ label() ?? (T.MH.PROJECT_SCOPE_ALL | translate) }}</span>
  <mat-icon
    class="scope-caret"
    iconPositionEnd
    >arrow_drop_down</mat-icon
  >
</button>

<mat-menu #scopeMenu>
  <button
    mat-menu-item
    (click)="setScope('')"
  >
    <select-option-row
      [title]="T.MH.PROJECT_SCOPE_ALL | translate"
      defaultIcon="filter_list"
      [showCheckbox]="true"
      selectionStyle="radio"
      [isSelected]="!isScoped()"
    ></select-option-row>
  </button>

  @for (project of projects(); track project.id) {
    <button
      mat-menu-item
      (click)="setScope(project.id)"
    >
      <select-option-row
        [title]="project.title"
        [icon]="project.icon"
        [defaultIcon]="DEFAULT_PROJECT_ICON"
        [color]="project.theme?.primary"
        [showCheckbox]="true"
        selectionStyle="radio"
        [isSelected]="project.id === scopeService.scope()"
      ></select-option-row>
    </button>
  }
</mat-menu>
